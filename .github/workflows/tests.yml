name: PHPUnit tests
run-name: ${{ github.actor }}
on:
  push:
    branches: [master, php-8.5-compatibility]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  symfony:
    name: Symfony 6.4 / PHP 8.5.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, mbstring, pdo, sqlite3, zip
          tools: composer:v2
          coverage: none
      - name: Validate dependencies
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Validate application configuration
        run: |
          php bin/console lint:container
          php bin/console lint:twig app/Resources/views
          php bin/console doctrine:schema:validate --skip-sync
      - name: Run unit and functional tests
        run: php -d memory_limit=512M bin/phpunit --configuration app/phpunit.xml.dist
