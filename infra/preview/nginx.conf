server {
  listen 8000;
  server_name _;
  root /app/public;
  add_header Cache-Control "no-store" always;
  location = /health {
    default_type application/json;
    return 200 '{"app":"vektor","stage":"p20","databaseAuthority":"container-local-mariadb","replacement":"synthetic-seed-on-container-replacement","sourceSha":"$PREVIEW_SOURCE_SHA","imageDigest":"$PREVIEW_IMAGE_DIGEST","seedDigest":"$PREVIEW_SEED_DIGEST"}';
  }
  location / {
    try_files $uri /index.php?$query_string;
  }
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass 127.0.0.1:9000;
  }
}
